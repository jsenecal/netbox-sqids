name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check netbox_sqids/ tests/
      - run: ruff format --check netbox_sqids/ tests/

  test:
    name: Test (Python ${{ matrix.python }}, NetBox ${{ matrix.netbox }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            netbox: "4.5.7"
          - python: "3.13"
            netbox: "4.5.7"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U netbox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Clone NetBox
        run: |
          git clone --depth 1 --branch v${{ matrix.netbox }} \
            https://github.com/netbox-community/netbox.git /opt/netbox

      - name: Install NetBox dependencies
        run: |
          pip install -r /opt/netbox/requirements.txt

      - name: Install plugin with dev deps
        run: |
          pip install -e ".[dev]"

      - name: Configure NetBox
        run: |
          cat > /opt/netbox/netbox/netbox/configuration.py << 'CONF'
          ALLOWED_HOSTS = ['*']
          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': 'localhost',
              'PORT': '5432',
              'ENGINE': 'django.db.backends.postgresql',
          }
          REDIS = {
              'tasks': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'DATABASE': 0,
              },
              'caching': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'DATABASE': 1,
              },
          }
          SECRET_KEY = 'ci-test-secret-key-not-for-production'
          PLUGINS = ['netbox_sqids']
          PLUGINS_CONFIG = {'netbox_sqids': {}}
          CONF

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: netbox.settings
          PYTHONPATH: /opt/netbox/netbox
        run: |
          pytest tests/ -v --tb=short

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install zensical
      - run: zensical build
