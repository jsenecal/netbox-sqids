[project]
site_name = "NetBox SQIDs"
site_description = "Short, URL-safe, globally unique identifiers for every NetBox object"
site_author = "Jonathan Senecal"
site_url = "https://jsenecal.github.io/netbox-sqids/"
copyright = "Copyright &copy; 2026 Jonathan Senecal"

nav = [
    { "Home" = "index.md" },
    { "User Guide" = [
        { "Getting Started" = "user/getting-started.md" },
        { "Using SQIDs" = "user/using-sqids.md" },
        { "Configuration" = "user/configuration.md" },
    ]},
    { "Developer Guide" = [
        { "Architecture" = "developer/architecture.md" },
        { "API Reference" = "developer/api-reference.md" },
        { "Contributing" = "developer/contributing.md" },
    ]},
]

[project.theme]
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
logo = "lucide/hash"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "light-blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "light-blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jsenecal/netbox-sqids"

[project.extra]
repo_url = "https://github.com/jsenecal/netbox-sqids"
repo_name = "jsenecal/netbox-sqids"
